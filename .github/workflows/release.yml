name: release

# Tag a commit to cut a release:
#   git tag v1.4.0.4 && git push origin v1.4.0.4
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate mod files
        run: python3 scripts/validate_mod.py .

      - name: Build release package
        run: python3 scripts/package_mod.py .

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
